<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>我的旅行地圖</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#ede8dd;--card:#faf6ee;--ink:#141e18;--mist:#7a9e8e;--line:rgba(37,69,58,.16);
  --forest:#25453a;--forest-mid:#3a6b55;--amber:#c98a2b;--coral:#bf5038;--land:#d6cfbe;--sea:#e4ebe6;
  --safe-t:env(safe-area-inset-top,0px);
}
html{scroll-behavior:smooth}
body{font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);
  min-height:100vh;-webkit-text-size-adjust:100%;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.wrap{max-width:620px;margin:0 auto;padding:0 18px 60px}

/* header */
.site-header{padding:calc(var(--safe-t) + 40px) 0 24px;text-align:center;position:relative}
.eyebrow{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--mist);margin-bottom:12px}
.site-title{font-family:Georgia,"Noto Serif TC",serif;font-weight:normal;font-size:44px;line-height:1.1;letter-spacing:-.02em;word-break:keep-all}
.site-sub{font-size:12px;color:var(--mist);letter-spacing:.06em;margin-top:6px}
.header-bar{width:28px;height:3px;border-radius:2px;background:var(--forest);opacity:.35;margin:16px auto 0}
.add-row{display:flex;justify-content:center;gap:10px;margin-top:20px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 18px;font-size:14px;font-weight:600;color:var(--forest)}
.btn:hover{background:#fff}
.btn.primary{background:var(--forest);color:#fff;border-color:var(--forest)}
.btn.primary:hover{background:var(--forest-mid)}
.btn.danger{color:var(--coral)}
.btn.small{padding:6px 12px;font-size:12px}

/* atlas */
.atlas-card{background:var(--card);border-radius:22px;padding:18px 16px 16px;box-shadow:0 1px 0 var(--line),0 12px 32px -18px rgba(20,30,24,.25)}
.atlas-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.kicker{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--mist)}
.atlas-title{font-family:Georgia,"Noto Serif TC",serif;font-weight:normal;font-size:22px}
.stats{display:flex;gap:14px}
.stats div{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.stats b{font-family:Georgia,serif;font-size:22px;color:var(--forest)}
.stats span{font-size:10px;color:var(--mist);margin-top:3px}
.tools{display:flex;gap:6px;margin:12px 0 8px}
.tools button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:12px;color:var(--mist)}
.tools button.on{background:var(--forest);color:#fff;border-color:var(--forest)}
.map{background:var(--sea);border-radius:14px;overflow:hidden}
.map svg{display:block;width:100%;height:auto}
.c-base{fill:var(--land);stroke:var(--bg);stroke-width:.4}
.c-on{fill:var(--forest-mid);stroke:var(--bg);stroke-width:.4;cursor:pointer}
.c-plan{fill:var(--amber);stroke:var(--bg);stroke-width:.4;cursor:pointer}
.c-on.hl,.c-plan.hl{filter:brightness(1.18)}
.dot-on{fill:var(--forest-mid);stroke:#fff;cursor:pointer}.dot-plan{fill:var(--amber);stroke:#fff;cursor:pointer}
.route{fill:none;stroke:var(--forest-mid);stroke-opacity:.55;stroke-dasharray:3 3;stroke-width:1}
.route.plan{stroke:var(--amber);stroke-opacity:.8}
.pin{cursor:pointer}
.pin circle{fill:#fff;stroke:var(--forest-mid);stroke-width:2}
.pin.plan circle{stroke:var(--amber)}
.pin text{font-size:15px;text-anchor:middle;dominant-baseline:central}
.pin.hl circle{fill:#f3fbf6}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--mist);margin:8px 2px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.stamps{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 4px;scrollbar-width:none}
.stamps::-webkit-scrollbar{display:none}
.stamp{flex:none;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 12px;font-size:13px;text-align:left}
.stamp small{color:var(--mist);font-size:11px}
.stamp.plan{border-color:rgba(201,138,43,.5)}
.stamp.hl{background:var(--forest);color:#fff;border-color:var(--forest)}
.stamp.hl small{color:#cfe0d6}
.stamp-flag{font-size:20px}
.detail-panel{margin-top:10px}
.hint{font-size:12px;color:var(--mist);text-align:center;padding:6px}
.panel{border-top:1px dashed var(--line);padding-top:12px}
.panel-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.panel-flag{font-size:34px}
.panel-name{font-family:Georgia,"Noto Serif TC",serif;font-size:20px}
.panel-sub{font-size:11px;color:var(--mist)}
.panel-label{font-size:10px;letter-spacing:.2em;color:var(--mist);margin:10px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.panel-trips a{display:flex;justify-content:space-between;align-items:center;text-decoration:none;background:#fff;border-radius:10px;padding:8px 12px;margin-bottom:6px;font-size:14px}
.panel-trips small{color:var(--mist);margin-left:8px}

/* section label */
.section-label{display:flex;align-items:center;gap:10px;margin:34px 0 14px}
.section-label span{font-size:10px;font-weight:700;letter-spacing:.22em;color:var(--forest)}
.section-label.done span{color:var(--mist)}
.section-label::after{content:"";flex:1;height:1px;background:var(--line)}

/* trip cards */
.grid{display:grid;gap:16px}
.trip-card{display:block;text-decoration:none;background:var(--card);border-radius:20px;overflow:hidden;box-shadow:0 1px 0 var(--line),0 12px 28px -18px rgba(20,30,24,.3);transition:transform .2s}
.trip-card:hover{transform:translateY(-2px)}
.trip-card.done .hero{filter:saturate(.55)}
.hero{position:relative;height:150px;background-size:cover;background-position:center}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.35))}
.badge,.year{position:absolute;z-index:1;font-size:11px;font-weight:700;color:#fff;background:rgba(0,0,0,.32);backdrop-filter:blur(4px);border-radius:999px;padding:3px 10px}
.badge{top:12px;left:12px}.year{top:12px;right:12px}
.card-body{padding:14px 16px 16px}
.trip-country{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mist);display:block}
.trip-name{font-family:Georgia,"Noto Serif TC",serif;font-size:22px;display:block;margin:2px 0}
.trip-dates{font-size:12px;color:var(--mist)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--forest)}
.trip-desc{font-size:13px;color:#4a5a50;margin-top:10px}

/* welcome */
.welcome{background:var(--card);border-radius:20px;padding:26px 20px;text-align:center;margin:26px 0 18px;box-shadow:0 1px 0 var(--line)}
.welcome h2{font-family:Georgia,"Noto Serif TC",serif;font-weight:normal;font-size:20px;margin-bottom:8px}
.welcome p{font-size:14px;color:#4a5a50;margin-bottom:14px}

/* footer tools */
.foot{margin-top:46px;padding-top:20px;border-top:1px solid var(--line);text-align:center}
.foot .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.foot p{font-size:11px;color:var(--mist);margin-top:12px}

/* detail */
.topbar{display:flex;justify-content:space-between;align-items:center;padding:calc(var(--safe-t) + 16px) 0 12px}
.d-hero{border-radius:20px;overflow:hidden;position:relative;min-height:170px;background-size:cover;background-position:center;color:#fff;padding:90px 18px 18px;display:flex;flex-direction:column;justify-content:flex-end}
.d-hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.6))}
.d-hero>*{position:relative}
.d-hero h1{font-family:Georgia,"Noto Serif TC",serif;font-weight:normal;font-size:30px;line-height:1.15}
.d-hero p{font-size:13px;opacity:.9}
.d-desc{margin:14px 2px;font-size:14px;color:#3a4a40}
.day{background:var(--card);border-radius:18px;padding:16px;margin-top:14px;box-shadow:0 1px 0 var(--line)}
.day-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.day-head>div:first-child{flex:1;min-width:0}
.day-no{font-size:11px;letter-spacing:.18em;color:var(--mist);font-weight:700}
.day-title{font-family:Georgia,"Noto Serif TC",serif;font-size:18px;margin:2px 0 8px}
.rows{list-style:none;border-left:2px solid var(--line);margin-left:6px}
.rows li{position:relative;padding:6px 0 6px 18px}
.rows li::before{content:"";position:absolute;left:-6px;top:14px;width:10px;height:10px;border-radius:50%;background:var(--forest-mid);border:2px solid var(--card)}
.r-time{font-size:11px;color:var(--mist);font-weight:700;display:block}
.r-act{font-size:15px}
.r-note{font-size:12px;color:#5b6b61;display:block}
.r-map{font-size:12px;text-decoration:none;margin-left:6px;color:var(--forest-mid)}
.empty-day{font-size:13px;color:var(--mist);padding:6px 0}
.edit-row{display:grid;grid-template-columns:78px 1fr auto;gap:6px;margin:6px 0 10px;padding-left:12px}
.edit-row .note{grid-column:2/3}
input,select,textarea{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:14px;width:100%}
textarea{resize:vertical;min-height:70px}
.xbtn{border:none;background:transparent;color:var(--coral);font-size:16px;padding:0 6px}
.add-line{margin:8px 0 0}

/* modal */
.modal{position:fixed;inset:0;background:rgba(20,30,24,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0}
.modal[hidden]{display:none}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px))}
@media(min-width:600px){.modal{align-items:center}.sheet{border-radius:22px}}
.sheet h3{font-family:Georgia,"Noto Serif TC",serif;font-weight:normal;font-size:20px;margin-bottom:12px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--mist);margin-bottom:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet .actions{display:flex;gap:8px;justify-content:space-between;margin-top:16px}
.cover-prev{height:90px;border-radius:12px;background-size:cover;background-position:center;margin-bottom:8px;background-color:#ddd}
.note-box{font-size:12px;color:var(--mist);margin-top:4px}
.share-banner{background:var(--forest);color:#fff;text-align:center;font-size:12px;padding:6px}
.err{color:var(--coral);font-size:12px;margin-top:4px}

/* 地點搜尋下拉 */
.sug{position:fixed;z-index:90;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px -10px rgba(20,30,24,.45);max-height:260px;overflow:auto}
.sug button{display:block;width:100%;text-align:left;border:none;background:transparent;padding:9px 12px;border-bottom:1px solid var(--line)}
.sug button:last-child{border-bottom:none}
.sug button:hover{background:var(--bg)}
.sug b{display:block;font-size:14px;font-weight:600}
.sug small{display:block;font-size:11px;color:var(--mist)}
.sug .msg{padding:10px 12px;font-size:12px;color:var(--mist)}
.sug .credit{padding:4px 12px;font-size:10px;color:var(--mist);text-align:right}
.r-tg{border:none;background:none;padding:0}
.map-embed{display:block;width:100%;height:220px;border:0;border-radius:12px;margin-top:8px;background:var(--sea)}
.edit-row .pl{grid-column:2/3;font-size:11px;color:var(--forest-mid)}

/* 預訂小卡 */
.bk{display:block;background:var(--card);border-radius:16px;margin-bottom:12px;box-shadow:0 1px 0 var(--line),0 10px 24px -16px rgba(20,30,24,.4);overflow:hidden;cursor:pointer;transition:transform .15s}
.bk:hover{transform:translateY(-1px)}
.bk.past{opacity:.55}
.bk-top{display:flex;gap:12px;align-items:flex-start;padding:14px 14px 13px}
.bk-ico{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none;background:var(--t)}
.bk-main{flex:1;min-width:0}
.bk-meta{font-size:12px;color:#5b6b61;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bk-chip{background:var(--c);color:#fff;border-radius:999px;padding:1px 9px;font-size:11px;font-weight:700;letter-spacing:.04em}
.bk-title{font-size:16px;font-weight:600;word-break:break-word;margin-top:4px}
.bk-sub{font-size:12px;color:#5b6b61;margin-top:4px}
.bk-thumb{width:46px;height:46px;border-radius:8px;background-size:cover;background-position:center;flex:none}
.bk-stub{position:relative;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-top:2px dashed var(--line);background:rgba(255,255,255,.6)}
.bk-stub::before,.bk-stub::after{content:"";position:absolute;top:-8px;width:14px;height:14px;border-radius:50%;background:var(--bg)}
.bk-stub::before{left:-7px}.bk-stub::after{right:-7px}
.bk-stub small{font-size:10px;color:var(--mist);letter-spacing:.14em;display:block}
.bk-code{font-family:ui-monospace,Menlo,monospace;font-size:16px;font-weight:700;letter-spacing:.08em;word-break:break-all;color:var(--c)}
.bk-ppl{font-size:12px;color:#5b6b61;text-align:right}
/* 點到點之間的交通 */
.rows li.leg{padding:2px 0 4px 18px;font-size:12px;color:var(--forest-mid)}
.rows li.leg::before{display:none}
.rows li.leg span{background:#fff;border:1px dashed var(--line);border-radius:999px;padding:2px 10px;display:inline-block}
.rows li.leg a{margin-left:6px;color:var(--forest-mid)}
.edit-go{display:grid;grid-template-columns:1fr 84px;gap:6px;margin:10px 0 0;padding-left:12px}
.edit-go input[data-f=go-note]{grid-column:1/3}
.edit-go select,.edit-go input{font-size:13px;padding:6px 8px;background:#f4f1e8}
.bk-hint{font-size:12px;color:var(--mist);text-align:center;padding:10px 4px}
.bk-prev{height:110px;border-radius:12px;background:#ddd center/contain no-repeat;margin-bottom:8px}
.show-ico{font-size:44px;line-height:1.1}
.show-title{font-family:Georgia,"Noto Serif TC",serif;font-size:28px;line-height:1.2;margin:4px 0 6px;word-break:break-word}
.show-when{font-size:18px;color:var(--forest);font-weight:700}
.show-code{font-family:ui-monospace,Menlo,monospace;font-size:32px;letter-spacing:.1em;text-align:center;background:#fff;border:2px dashed var(--forest-mid);border-radius:14px;padding:14px 8px;margin:16px 0;word-break:break-all}
.show-row{font-size:15px;margin-top:8px;white-space:pre-wrap}
.show-row a{color:var(--forest-mid)}
.show-img{display:block;width:100%;border-radius:12px;margin-top:14px}
.remind{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:#fbf0d9;border:1px solid rgba(201,138,43,.45);border-radius:14px;padding:10px 14px;margin:0 0 16px;font-size:13px}
.remind span{display:flex;gap:6px}
</style>
</head>

var GRAD=[['#25453a','#6b9a7e'],['#1e5878','#6aa7c4'],['#6e2230','#c0704a'],['#4a3a6b','#9a8ac4'],['#8a5a1e','#d9a441'],['#2f6e74','#7fc4b8'],['#5a3a2a','#b88a6a'],['#3a4a6b','#8aa0c4']];

function coverStyle(t){
  if(t.cover)return 'background-image:url('+t.cover+')';

function countryStatus(){

   +(t.desc?'<p class="trip-desc">'+esc(t.desc)+'</p>':'')+'</div></a>';

function atlasSvg(){
  var st=countryStatus(),h=AT[D.home]||AT.TW||[500,250],out=[];
  Object.keys(MAP.paths).forEach(function(c){
    out.push('<path class="'+(st[c]==='on'?'c-on':st[c]==='plan'?'c-plan':'c-base')+'"'+(st[c]?' data-c="'+c+'"':'')+' d="'+MAP.paths[c]+'"/>');
  });
  var routes=[],pins=[],dots=[];
  D.trips.forEach(function(t){
    if(!AT[t.cc]||t.cc===D.home)return;
    var b=AT[t.cc],dx=b[0]-h[0],dy=b[1]-h[1],L=Math.sqrt(dx*dx+dy*dy)||1,nx=-dy/L,ny=dx/L;
    if(ny>0){nx=-nx;ny=-ny;}
    var bend=Math.min(L*.22,60),cx=(h[0]+b[0])/2+nx*bend,cy=(h[1]+b[1])/2+ny*bend;
    routes.push('<path class="route'+(isDone(t)?'':' plan')+'" d="M'+h[0]+','+h[1]+' Q'+cx+','+cy+' '+b[0]+','+b[1]+'"/>');
  });
  Object.keys(st).forEach(function(c){
    if(!MAP.paths[c])dots.push('<circle class="dot-'+st[c]+'" data-c="'+c+'" cx="'+AT[c][0]+'" cy="'+AT[c][1]+'" r="3"/>');
    pins.push('<g class="pin'+(st[c]==='plan'?' plan':'')+'" data-c="'+c+'"><circle r="13"/><text>'+flag(c)+'</text></g>');
  });
  return '<svg id="atlasSvg" viewBox="'+vb.join(' ')+'" role="img" aria-label="世界地圖，標示去過的國家">'+out.join('')+routes.join('')+dots.join('')+pins.join('')+'</svg>';
}

    var n=D.trips.filter(function(t){return t.cc===c&&isDone(t);}).length;
    return '<button type="button" class="stamp'+(st[c]==='plan'?' plan':'')+'" data-c="'+c+'"><span class="stamp-flag">'+flag(c)+'</span><span><b>'+esc(cname(c))+'</b> <small>'+(st[c]==='plan'?'即將出發':n+' 趟')+'</small></span></button>';
  }).join('');
}

/* 地圖互動 */
var ANIM=0;
function layout(){
  var svg=$('#atlasSvg');if(!svg)return;
  var w=svg.getBoundingClientRect().width||600,k=vb[2]/w,z=w<520?.8:1;
  var st=countryStatus();
  svg.querySelectorAll('.pin').forEach(function(p){
    var a=AT[p.getAttribute('data-c')],show=vb[2]<700||p.getAttribute('data-c')===CUR;
    p.style.display=show?'':'none';
    p.setAttribute('transform','translate('+a[0]+','+(a[1]-18*k*z)+') scale('+k*z+')');
  });
  svg.querySelectorAll('.dot-on,.dot-plan').forEach(function(d){d.setAttribute('r',3.4*k*z);d.setAttribute('stroke-width',1.2*k*z);});
  svg.querySelectorAll('.route').forEach(function(r){r.setAttribute('stroke-width',1.2*k*z);r.setAttribute('stroke-dasharray',(3*k*z*2)+' '+(3*k*z*2));});
  void st;
}
function setView(v){vb=v;var s=$('#atlasSvg');if(s)s.setAttribute('viewBox',v.join(' '));layout();}
function animate(to){
  var from=vb.slice(),t0=null,id=++ANIM;
  function step(ts){
    if(id!==ANIM)return;if(!t0)t0=ts;
    var u=Math.min(1,(ts-t0)/450),e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
    setView(from.map(function(f,i){return f+(to[i]-f)*e;}));
    if(u<1)requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
function setTool(name){document.querySelectorAll('.tools button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-view')===name);});}
function boxFor(c){
  var b=BOX[c],R=VIEWS.world[2]/VIEWS.world[3],cx=b[0]+b[2]/2,cy=b[1]+b[3]/2;
  var w=Math.max(b[2]*2.2,b[3]*2.2*R,130),h=w/R;
  return [cx-w/2,cy-h/2,w,h];
}
function panelHtml(c){
  var ts=D.trips.filter(function(t){return t.cc===c;}).sort(function(a,b){return a.start<b.start?1:-1;}),seen={},cities=[];
  ts.forEach(function(t){(t.cities||[]).forEach(function(x){if(!seen[x]){seen[x]=1;cities.push(x);}});});
  var plan=ts.every(function(t){return !isDone(t);});
  return '<div class="panel"><div class="panel-head"><span class="panel-flag">'+flag(c)+'</span><div><div class="panel-sub">'+(plan?'即將出發':'去過了')+'</div><div class="panel-name">'+esc(cname(c))+'</div></div></div>'
   +(cities.length?'<div class="panel-label">城市 · '+cities.length+'</div><div class="chips">'+cities.map(function(x){return '<span class="chip">'+esc(x)+'</span>';}).join('')+'</div>':'')
   +'<div class="panel-label">行程</div><div class="panel-trips">'+ts.map(function(t){return '<a href="#trip/'+t.id+'"><span><b>'+esc(t.name)+'</b><small>'+yearMonth(t)+'</small></span><i>→</i></a>';}).join('')+'</div></div>';
}
function pick(c){
  CUR=(c===CUR)?null:c;
  document.querySelectorAll('#app [data-c]').forEach(function(n){n.classList.toggle('hl',n.getAttribute('data-c')===CUR);});
  var panel=$('#detailPanel');
  if(CUR){setTool(null);animate(boxFor(CUR));panel.innerHTML=panelHtml(CUR);}
  else{setTool('world');animate(VIEWS.world);panel.innerHTML='<p class="hint">點國旗或地圖上的國家，看看去過哪些城市</p>';}
  layout();

function dayDate(t,i){if(!t.start)return '';var s=addDays(t.start,i),d=parse(s);return (d.getMonth()+1)+'/'+d.getDate()+'（'+WEEK[d.getDay()]+'）';}
/* 地圖：有選過地點就用「名稱＋地址」搜尋；預覽小地圖用座標，位置最準 */
var OPEN={};
function mapQuery(t,text,pl){
  if(pl&&(pl.name||pl.addr))return [pl.name,pl.addr].filter(Boolean).join(' ');
  return text+' '+((t.cities&&t.cities[0])||cname(t.cc));
}
function mapLink(t,text,pl){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(mapQuery(t,text,pl));}
function mapEmbed(t,text,pl){
  var q=(pl&&pl.lat!=null&&pl.lon!=null)?pl.lat+','+pl.lon+'('+String(pl.name||text).replace(/[()]/g,' ')+')':mapQuery(t,text,pl);
  return 'https://maps.google.com/maps?q='+encodeURIComponent(q)+'&z=15&output=embed';
}
function goHtml(t,prev,r){
  var g=r.go;if(!g||!(g.mode||g.min||g.note))return '';
  var m=GO[g.mode]||GO.other,mm=+g.min,dur=mm?(mm>=60?Math.floor(mm/60)+' 小時'+(mm%60?' '+mm%60+' 分':''):mm+' 分'):'';
  var nav=(prev&&prev.act&&r.act)?'<a target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(mapQuery(t,prev.act,prev.place))
    +'&destination='+encodeURIComponent(mapQuery(t,r.act,r.place))+(m[2]?'&travelmode='+m[2]:'')+'">導航</a>':'';
  return '<li class="leg"><span>'+m[0]+' '+[g.mode?m[1]:'',dur,g.note?esc(g.note):''].filter(Boolean).join(' · ')+'</span>'+nav+'</li>';
}
function rowView(t,di,ri,r){

   +(r.act?'<a class="r-map" target="_blank" rel="noopener" href="'+mapLink(t,r.act,r.place)+'">📍地圖</a>'
     +'<button type="button" class="r-map r-tg" data-act="toggle-map" data-d="'+di+'" data-r="'+ri+'">'+(open?'收起':'🗺 預覽')+'</button>':'')
   +(r.place&&r.place.addr?'<span class="r-note">'+esc(r.place.addr)+'</span>':'')

   +(open?'<iframe class="map-embed" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="地圖預覽" src="'+esc(mapEmbed(t,r.act,r.place))+'"></iframe>':'')+'</li>';
}

/* ───────── 地點搜尋（OpenStreetMap／Photon，免金鑰、免註冊） ───────── */
var sug=document.createElement('div');sug.className='sug';sug.hidden=true;document.body.appendChild(sug);
var SUG={items:[],timer:0,seq:0};
function hideSug(){sug.hidden=true;SUG.items=[];clearTimeout(SUG.timer);SUG.seq++;}
function showSug(input,html){
  var r=input.getBoundingClientRect(),below=window.innerHeight-r.bottom;
  sug.innerHTML=html;sug.hidden=false;
  sug.style.left=Math.max(8,r.left)+'px';sug.style.width=Math.max(r.width,240)+'px';
  if(below<240&&r.top>below){sug.style.top='auto';sug.style.bottom=(window.innerHeight-r.top+4)+'px';}
  else{sug.style.bottom='auto';sug.style.top=(r.bottom+4)+'px';}
}
function parseGmaps(s){
  if(!/^https?:\/\//i.test(s))return null;
  if(!/google\.[a-z.]+\/maps|maps\.google\.|goo\.gl\/maps|maps\.app\.goo\.gl/i.test(s))return null;
  var o={name:'',addr:'',lat:null,lon:null},dec=function(x){try{return decodeURIComponent(x.replace(/\+/g,' '));}catch(e){return x.replace(/\+/g,' ');}};
  var m=s.match(/\/place\/([^\/@?]+)/);if(m)o.name=dec(m[1]);
  var c=s.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||s.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/);
  if(c){o.lat=+c[1];o.lon=+c[2];}
  if(!o.name){var q=s.match(/[?&]q=([^&]+)/);if(q)o.name=dec(q[1]);}
  return o;
}
function searchPlaces(q,cc,done){
  var id=++SUG.seq;
  fetch('https://photon.komoot.io/api/?limit=10&q='+encodeURIComponent(q)).then(function(r){return r.json();}).then(function(j){
    if(id!==SUG.seq)return;
    var L=(j.features||[]).map(function(f){
      var p=f.properties||{},g=f.geometry.coordinates,street=[p.street,p.housenumber].filter(Boolean).join(' '),name=p.name||street;
      var parts=[p.countrycode===cc?'':p.country,p.state,p.city||p.town||p.village,p.district,street===name?'':street];
      var addr=parts.filter(function(x,i){return x&&parts.indexOf(x)===i&&x!==name;}).join(' ');
      return {name:name,addr:addr,lat:g[1],lon:g[0],cc:p.countrycode};
    }).filter(function(x){return x.name;});
    L=L.filter(function(x){return x.cc===cc;}).concat(L.filter(function(x){return x.cc!==cc;})).slice(0,6);
    done(L);
  }).catch(function(){if(id===SUG.seq)done(null);});
}
function placeApply(el,pl){
  var k=el.getAttribute('data-ac');
  hideSug();
  if(k==='row'){
    var r=curT().days[+el.getAttribute('data-d')].rows[+el.getAttribute('data-r')];
    r.act=pl.name||'地圖上的地點';r.place={name:r.act,addr:pl.addr||'',lat:pl.lat,lon:pl.lon};
    save();renderTrip(true);
  }else{
    var ti=$('#b_title'),ad=$('#b_addr');
    if(k==='bk-title'){ti.value=pl.name||ti.value;ad.value=pl.addr||pl.name||ad.value;}
    else{ad.value=pl.addr||pl.name||ad.value;if(!ti.value.trim())ti.value=pl.name||'';}
    formPlace=(pl.lat!=null)?{lat:pl.lat,lon:pl.lon}:null;
  }
}
document.addEventListener('input',function(e){
  var el=e.target,k=el.getAttribute&&el.getAttribute('data-ac');if(!k)return;
  var v=el.value.trim();hideSug();
  if(k!=='row')formPlace=null;
  var g=parseGmaps(v);
  if(g){
    if(g.name||g.lat!=null){SUG.items=[g];placeApply(el,g);}
    else showSug(el,'<div class="msg">這是 Google 地圖的短網址，讀不出地點。<br>請在 Google 地圖按「分享」複製完整網址，或直接輸入地點名稱。</div>');
    return;
  }
  if(k==='bk-title'&&/^(flight|transit|other)$/.test($('#b_type').value))return;
  if(v.length<2||/^https?:/i.test(v))return;
  var cc=curT().cc;
  SUG.timer=setTimeout(function(){
    searchPlaces(v,cc,function(L){
      if(L===null){showSug(el,'<div class="msg">目前連不上地點搜尋（可能沒有網路），可以直接手動輸入。</div>');return;}
      SUG.items=L;
      showSug(el,L.length?L.map(function(x,i){return '<button type="button" data-sug="'+i+'"><b>'+esc(x.name)+'</b>'+(x.addr?'<small>'+esc(x.addr)+'</small>':'')+'</button>';}).join('')
        +'<div class="credit">© OpenStreetMap</div>':'<div class="msg">找不到這個地點，可以直接手動輸入，或貼上 Google 地圖網址。</div>');
      SUG.el=el;
    });
  },400);
});

function resizeImage(file,cb,M,q){
  var fr=new FileReader();
  fr.onload=function(){var img=new Image();img.onload=function(){
    var r=Math.min(1,(M||900)/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);
    var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);   /* 透明底的截圖不要變黑 */
    x.drawImage(img,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',q||.8));};
    img.onerror=function(){alert('這張圖片無法讀取，請換一張（jpg、png 皆可）。');};img.src=fr.result;};
  fr.readAsDataURL(file);
}

});
document.addEventListener('input',function(e){
  var el=e.target,f=el.getAttribute&&el.getAttribute('data-f');if(!f||view!=='trip')return;
  var t=curT(),di=+el.getAttribute('data-d'),ri=+el.getAttribute('data-r');
  if(f==='dtitle')t.days[di].title=el.value;
  else if(f==='act'){
    if(parseGmaps(el.value.trim()))return;   /* 貼上地圖網址：交給地點搜尋處理 */
    var r=t.days[di].rows[ri];r.act=el.value;
    if(r.place&&r.place.name!==el.value)delete r.place;   /* 手動改字後，不再綁定原本選的地點 */
  }else if(f.indexOf('go-')===0){var rr=t.days[di].rows[ri];rr.go=rr.go||{};rr.go[f.slice(3)]=el.value;}
  else t.days[di].rows[ri][f]=el.value;
  save();
});
$('#fileBk').addEventListener('change',function(){
  var f=this.files[0];this.value='';if(!f)return;
  resizeImage(f,function(data){formImg=data;$('#bkPrev').style.backgroundImage='url('+data+')';},1400,.8);
});
$('#fileCover').addEventListener('change',function(){
  var f=this.files[0];this.value='';if(!f)return;
  resizeImage(f,function(data){formCover=data;$('#coverPrev').style.backgroundImage='url('+data+')';});
});
$('#fileRestore').addEventListener('change',function(){
  var f=this.files[0];this.value='';if(!f)return;
  var fr=new FileReader();fr.onload=function(){
    try{var d=JSON.parse(fr.result);if(!d||!Array.isArray(d.trips))throw 0;
      if(!confirm('還原後，目前的資料會被備份檔取代。繼續？'))return;D=d;save();renderHome();}
    catch(err){alert('這不是有效的備份檔。');}
  };fr.readAsText(f);
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(!sug.hidden)hideSug();else if(!modal.hidden)closeModal();}});
window.addEventListener('scroll',function(e){if(!sug.hidden&&e.target!==sug)hideSug();},true);
window.addEventListener('resize',layout);

/* ───────── 路由 ───────── */
function route(){
  var m=location.hash.match(/^#trip\/(.+)$/);
  if(m&&D.trips.some(function(t){return t.id===m[1];})){view='trip';curTrip=m[1];renderTrip();}
  else{view='home';renderHome();}
}
window.addEventListener('hashchange',function(){editing=false;OPEN={};hideSug();route();});
load();
document.title=D.title;
route();
})();
</script>
</body>
</html>
